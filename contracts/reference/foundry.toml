# Compiler settings pinned to NetNet's verified build (Sourcify, chain 4663):
# solc 0.8.30, optimizer on / 800 runs, evmVersion osaka, viaIR off.
# Keep these identical to reference/foundry.toml so `diff -r reference/src src`
# is the only thing that explains a bytecode difference.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
optimizer_runs = 800
evm_version = "osaka"
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
robinhood = "https://robinhood-rpc.publicnode.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
