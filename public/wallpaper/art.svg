<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <!-- Moass Fund XP wallpaper, layer 2 of 2: moon, green candles, rocket.
       Pinned to the TOP-RIGHT corner of the screen at its natural aspect ratio, so the
       moon sits in the corner on every screen. The glow is meant to run off the edges. -->
  <defs>
    <radialGradient id="art-moon" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".7" stop-color="#f3e6c4"/>
      <stop offset="1" stop-color="#d9c49a"/>
    </radialGradient>
    <radialGradient id="art-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art-trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- moon, tucked into the corner -->
  <circle cx="782" cy="116" r="220" fill="url(#art-glow)"/>
  <circle cx="782" cy="116" r="90" fill="url(#art-moon)"/>
  <circle cx="754" cy="94" r="14" fill="#d9c49a" opacity=".55"/>
  <circle cx="810" cy="142" r="20" fill="#d9c49a" opacity=".45"/>
  <circle cx="792" cy="74" r="8" fill="#d9c49a" opacity=".5"/>

  <!-- candles: wick line + body. green closes higher, red closes lower. last one touches the moon -->
  <g opacity=".55" stroke-width="2">
    <g fill="#5fd35f" stroke="#5fd35f">
      <line x1="200" x2="200" y1="474" y2="514"/><rect x="190" y="488" width="20" height="12" rx="2"/>
      <line x1="272" x2="272" y1="456" y2="508"/><rect x="262" y="470" width="20" height="25" rx="2"/>
      <line x1="308" x2="308" y1="444" y2="486"/><rect x="298" y="458" width="20" height="14" rx="2"/>
      <line x1="380" x2="380" y1="424" y2="486"/><rect x="370" y="438" width="20" height="34" rx="2"/>
      <line x1="416" x2="416" y1="406" y2="454"/><rect x="406" y="420" width="20" height="20" rx="2"/>
      <line x1="488" x2="488" y1="376" y2="446"/><rect x="478" y="390" width="20" height="42" rx="2"/>
      <line x1="524" x2="524" y1="352" y2="406"/><rect x="514" y="366" width="20" height="26" rx="2"/>
      <line x1="596" x2="596" y1="316" y2="392"/><rect x="586" y="330" width="20" height="48" rx="2"/>
      <line x1="632" x2="632" y1="286" y2="346"/><rect x="622" y="300" width="20" height="32" rx="2"/>
      <line x1="704" x2="704" y1="232" y2="330"/><rect x="694" y="248" width="20" height="66" rx="2"/>
    </g>
    <g fill="#ff6b6f" stroke="#ff6b6f">
      <line x1="236" x2="236" y1="476" y2="511"/><rect x="226" y="490" width="20" height="7" rx="2"/>
      <line x1="344" x2="344" y1="446" y2="488"/><rect x="334" y="460" width="20" height="14" rx="2"/>
      <line x1="452" x2="452" y1="408" y2="448"/><rect x="442" y="422" width="20" height="12" rx="2"/>
      <line x1="560" x2="560" y1="354" y2="394"/><rect x="550" y="368" width="20" height="12" rx="2"/>
      <line x1="668" x2="668" y1="288" y2="330"/><rect x="658" y="302" width="20" height="14" rx="2"/>
    </g>
  </g>

  <!-- rocket trail + vector rocket (no emoji: identical on every OS, editable in Figma/Illustrator) -->
  <path d="M330 400 C 460 330, 560 250, 655 172" fill="none" stroke="url(#art-trail)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g transform="translate(676 154) rotate(50) scale(1.55)">
    <path d="M-5 14 C -4 24, 0 30, 0 36 C 0 30, 4 24, 5 14Z" fill="#f8b636"/>
    <path d="M-2.5 14 C -2 20, 0 24, 0 27 C 0 24, 2 20, 2.5 14Z" fill="#fff3a0"/>
    <path d="M-9 3 L -18 19 L -9 14Z" fill="#c8141c"/>
    <path d="M9 3 L 18 19 L 9 14Z" fill="#c8141c"/>
    <path d="M0 -27 C 9 -17, 11 -2, 9 14 L -9 14 C -11 -2, -9 -17, 0 -27Z" fill="#f4f4f4"/>
    <path d="M0 -27 C 5 -21, 8 -15, 9.6 -8 L -9.6 -8 C -8 -15, -5 -21, 0 -27Z" fill="#e31b23"/>
    <circle cx="0" cy="0" r="4.4" fill="#7fd3ff" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>
</svg>
