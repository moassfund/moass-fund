<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Moass Fund XP wallpaper, layer 1 of 2: night sky + glossy red hills.
       Scaled to cover the screen with the BOTTOM edge pinned, so the hills always show. -->
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050006"/>
      <stop offset=".45" stop-color="#2a0308"/>
      <stop offset=".72" stop-color="#7d0a10"/>
      <stop offset=".86" stop-color="#e31b23"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="sky-hill-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d0a10"/>
      <stop offset="1" stop-color="#1f0205"/>
    </linearGradient>
    <linearGradient id="sky-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset=".18" stop-color="#e31b23"/>
      <stop offset=".6" stop-color="#8a0b12"/>
      <stop offset="1" stop-color="#3d0306"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky-grad)"/>

  <g fill="#fff" opacity=".8">
    <circle cx="90" cy="80" r="1.4"/><circle cx="210" cy="190" r="1"/><circle cx="340" cy="60" r="1.6"/>
    <circle cx="470" cy="150" r="1.1"/><circle cx="610" cy="40" r="1.3"/><circle cx="720" cy="210" r="1"/>
    <circle cx="830" cy="110" r="1.5"/><circle cx="960" cy="60" r="1"/><circle cx="1040" cy="230" r="1.2"/>
    <circle cx="1180" cy="90" r="1.1"/><circle cx="1350" cy="300" r="1"/><circle cx="1500" cy="60" r="1.2"/>
    <circle cx="1560" cy="240" r="1"/><circle cx="150" cy="300" r="1"/><circle cx="540" cy="300" r="1.2"/>
    <circle cx="900" cy="320" r="1"/><circle cx="1240" cy="380" r="1.1"/><circle cx="60" cy="420" r="1"/>
  </g>

  <path d="M0 700 C 260 600, 520 640, 800 690 S 1320 640, 1600 600 L1600 900 L0 900Z" fill="url(#sky-hill-back)"/>
  <path d="M0 790 C 300 650, 640 640, 960 730 S 1400 800, 1600 720 L1600 900 L0 900Z" fill="url(#sky-hill)"/>
  <path d="M60 770 C 330 664, 630 660, 930 738" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
</svg>
